<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · PBAT DOOR TO DOOR</title>
<meta name="theme-color" content="#06492a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6b3d'/%3E%3Cpath d='M10 26V7h12v19' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%23e2a72e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 21V3h12v18M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.3" fill="#e2a72e"/></svg></span>
      <span>PBAT DOOR TO DOOR<small>Volunteer network</small></span>
    </a>
    <div class="nav-links">
      <a class="hide-sm" href="/#works">His works</a>
      <a class="btn small" href="/join">Join now</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="boot step active" id="s-boot">Loading…</div>

    <form class="card narrow step" id="s-email" novalidate>
      <h1>Welcome back</h1>
      <p class="sub">Enter the email you joined with and we'll send you a 6-digit code. No password needed.</p>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      </div>
      <button class="btn block" id="send" type="submit" style="margin-top:16px"><span class="spinner"></span><span>Send me a code</span></button>
      <div class="msg err" id="email-err"></div>
      <p class="switch">New here? <a href="/join">Join PBAT DOOR TO DOOR</a></p>
    </form>

    <form class="card narrow step" id="s-code" novalidate>
      <h1>Check your inbox</h1>
      <p class="sub">We sent a code to <strong id="sent-to"></strong>. It expires in 10 minutes.</p>
      <div class="otp" id="otp" role="group" aria-label="Confirmation code"></div>
      <button class="btn block" id="verify" type="submit" style="margin-top:16px"><span class="spinner"></span><span>Log in</span></button>
      <div class="msg err" id="code-err"></div>
      <div class="msg dev" id="dev-note"></div>
      <div class="row">
        <button type="button" class="linkish" id="back">← Use a different email</button>
        <button type="button" class="linkish" id="resend" disabled>Resend code</button>
      </div>
    </form>
  </div>
</main>

<script type="module">
  import { $, api, setLoading, message, devCodeNote, showStep, createOtp, cooldown } from '/app.js';

  let email = '';
  const me = await api('/api/me');
  if (me.ok) location.replace('/account');
  showStep('s-email'); $('#email').focus();

  async function send(btn) {
    const { ok, data } = await api('/api/auth/request-code', { email });
    if (!ok) {
      if (data.code === 'no_account') {
        const span = document.createElement('span');
        span.innerHTML = 'No account uses this email yet. <a href="/join">Join now</a>.';
        return { error: span };
      }
      if (data.retryAfter) cooldown($('#resend'), data.retryAfter);
      return { error: data.error || 'Something went wrong.', retry: Boolean(data.retryAfter) };
    }
    devCodeNote($('#dev-note'), data.devCode);
    cooldown($('#resend'), data.cooldown);
    return {};
  }

  $('#s-email').addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = $('#email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) return message($('#email-err'), 'Enter a valid email address.');
    email = value; message($('#email-err'), '');
    const btn = $('#send'); setLoading(btn, true);
    const { error, retry } = await send();
    setLoading(btn, false);
    if (error && !retry) return message($('#email-err'), error);
    $('#sent-to').textContent = email;
    message($('#code-err'), retry ? error : '');
    showStep('s-code'); otp.clear();
  });

  const otp = createOtp($('#otp'), () => $('#s-code').requestSubmit());
  $('#s-code').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = otp.value();
    if (code.length !== 6) return message($('#code-err'), 'Enter all 6 digits.');
    const btn = $('#verify'); if (btn.disabled) return;
    setLoading(btn, true);
    const { ok, data } = await api('/api/auth/verify-code', { email, code });
    setLoading(btn, false);
    if (!ok) {
      otp.shake(); otp.clear();
      message($('#code-err'), data.error || 'Something went wrong.');
      if (data.expired) { clearInterval($('#resend')._timer); $('#resend').disabled = false; $('#resend').textContent = 'Send a new code'; }
      return;
    }
    location.href = '/account';
  });

  $('#resend').addEventListener('click', async () => {
    $('#resend').disabled = true; message($('#code-err'), '');
    const { error } = await send();
    if (error) return message($('#code-err'), error);
    message($('#code-err'), 'A new code is on its way.', 'ok'); otp.clear();
  });

  $('#back').addEventListener('click', () => { clearInterval($('#resend')._timer); showStep('s-email'); $('#email').focus(); });
</script>
</body>
</html>
