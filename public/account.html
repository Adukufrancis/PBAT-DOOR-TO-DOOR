<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account · PBAT DOOR TO DOOR</title>
<meta name="theme-color" content="#06492a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6b3d'/%3E%3Cpath d='M10 26V7h12v19' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%23e2a72e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 21V3h12v18M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.3" fill="#e2a72e"/></svg></span>
      <span>PBAT DOOR TO DOOR<small>Volunteer network</small></span>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a class="hide-sm" href="/#works">His works</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="boot" id="boot">Loading your account…</div>

    <div id="content" hidden>
      <div class="welcome" id="welcome" hidden>
        <strong>Welcome to PBAT DOOR TO DOOR!</strong> Your account is ready. You'll stay logged in on this device until you log out.
      </div>

      <div class="account">
        <aside class="card member">
          <div class="avatar" id="avatar"></div>
          <h2 id="name"></h2>
          <div class="email" id="email"></div>
          <div class="badge">Member since <span id="since"></span></div>
          <div class="actions">
            <button class="btn ghost" id="logout"><span class="spinner"></span><span>Log out</span></button>
            <button class="btn danger" id="logout-all"><span class="spinner"></span><span>Log out of all devices</span></button>
          </div>
        </aside>

        <div style="display:grid;gap:22px">
          <section class="card" id="view">
            <div class="card-head">
              <h2>My details</h2>
              <button class="btn small ghost" id="edit">Edit</button>
            </div>
            <dl class="details" id="details"></dl>
          </section>

          <form class="card" id="edit-form" hidden novalidate>
            <div class="card-head"><h2>Edit my details</h2></div>
            <div id="fields"></div>
            <div class="msg err" id="edit-err"></div>
            <div style="display:flex;gap:10px;margin-top:6px">
              <button class="btn" id="save" type="submit"><span class="spinner"></span><span>Save changes</span></button>
              <button class="btn ghost" id="cancel" type="button">Cancel</button>
            </div>
          </form>

          <section class="card">
            <div class="card-head"><h2>Logged-in devices</h2></div>
            <div id="sessions"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { $, api, setLoading, message, renderProfileFields, readProfileFields, checkProfile, showFieldErrors, prettyPhone } from '/app.js';

  const { ok, data } = await api('/api/me');
  if (!ok) { location.replace('/login'); await new Promise(() => {}); }
  if (!data.member.profileComplete) { location.replace('/welcome'); await new Promise(() => {}); }
  const { data: opts } = await api('/api/options');
  let user = data.member;

  const LABELS = [
    ['full_name', 'Full name'], ['email', 'Email'], ['phone', 'Phone'], ['gender', 'Gender'],
    ['date_of_birth', 'Date of birth'], ['state', 'State'], ['lga', 'LGA'], ['ward', 'Ward'],
    ['polling_unit', 'Polling unit'], ['occupation', 'Occupation'], ['address', 'Address'], ['interests', 'Can help with'],
  ];
  const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtDob = (s) => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }) : '';

  function render() {
    $('#avatar').textContent = user.full_name.split(' ').map((w) => w[0]).slice(0, 2).join('');
    $('#name').textContent = user.full_name;
    $('#email').textContent = user.emailVerified ? user.email : prettyPhone(user.phone) || user.email;
    $('#since').textContent = fmtDate(user.createdAt);
    const dl = $('#details'); dl.innerHTML = '';
    for (const [key, label] of LABELS) {
      let val = user[key];
      if (key === 'interests') val = val.join(', ');
      if (key === 'date_of_birth') val = fmtDob(val);
      if (key === 'phone') val = prettyPhone(val);
      if ((key === 'email' && user.emailVerified) || (key === 'phone' && user.phoneVerified)) val += '  ✓ verified';
      const wrap = document.createElement('div');
      const dt = document.createElement('dt'); dt.textContent = label;
      const dd = document.createElement('dd'); dd.textContent = val || '—';
      wrap.append(dt, dd); dl.append(wrap);
    }
  }

  function deviceName(ua = '') {
    const b = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Chrome\//.test(ua) ? 'Chrome'
      : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    const os = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows'
      : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '';
    return os ? `${b} on ${os}` : b;
  }
  function ago(ts) {
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60); if (h < 24) return `${h} h ago`;
    return fmtDate(ts);
  }
  function renderSessions(list) {
    const box = $('#sessions'); box.innerHTML = '';
    for (const s of list) {
      const row = document.createElement('div'); row.className = 'session';
      const name = document.createElement('span'); name.textContent = deviceName(s.userAgent);
      if (s.current) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'THIS DEVICE'; name.append(t); }
      const when = document.createElement('span'); when.className = 'when'; when.textContent = s.current ? 'Active now' : ago(s.lastSeen);
      row.append(name, when); box.append(row);
    }
  }

  render(); renderSessions(data.sessions);
  if (new URLSearchParams(location.search).has('welcome')) {
    $('#welcome').hidden = false; history.replaceState(null, '', '/account');
  }
  $('#boot').hidden = true; $('#content').hidden = false;

  // Edit details
  const fields = $('#fields');
  $('#edit').addEventListener('click', () => {
    renderProfileFields(fields, opts, user);
    message($('#edit-err'), '');
    $('#view').hidden = true; $('#edit-form').hidden = false; $('#f-full_name').focus();
  });
  $('#cancel').addEventListener('click', () => { $('#edit-form').hidden = true; $('#view').hidden = false; });
  $('#edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p = readProfileFields(fields);
    if (!showFieldErrors(fields, checkProfile(p, user))) return message($('#edit-err'), 'Please fix the highlighted fields.');
    const btn = $('#save'); setLoading(btn, true);
    const res = await api('/api/me', p);
    setLoading(btn, false);
    if (!res.ok) {
      if (res.data.fields) showFieldErrors(fields, res.data.fields);
      return message($('#edit-err'), res.data.error || 'Something went wrong.');
    }
    user = res.data.member; render();
    $('#edit-form').hidden = true; $('#view').hidden = false;
  });

  // Log out
  async function logout(path, btn) {
    setLoading(btn, true);
    await api(path, {});
    location.href = '/login';
  }
  $('#logout').addEventListener('click', (e) => logout('/api/auth/logout', e.currentTarget));
  $('#logout-all').addEventListener('click', (e) => {
    if (confirm('Log out of every device, including this one?')) logout('/api/auth/logout-all', e.currentTarget);
  });
</script>
</body>
</html>
