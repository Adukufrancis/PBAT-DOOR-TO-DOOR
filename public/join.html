<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join · PBAT DOOR TO DOOR</title>
<meta name="theme-color" content="#06492a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6b3d'/%3E%3Cpath d='M10 26V7h12v19' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%23e2a72e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 21V3h12v18M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.3" fill="#e2a72e"/></svg></span>
      <span>PBAT DOOR TO DOOR<small>Volunteer network</small></span>
    </a>
    <div class="nav-links">
      <a class="hide-sm" href="/#works">His works</a>
      <a class="btn small ghost" href="/login">Log in</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="boot step active" id="s-boot">Loading…</div>

    <!-- Step 1: details -->
    <form class="card wide step" id="s-form" novalidate>
      <h1>Join PBAT DOOR TO DOOR</h1>
      <p class="sub">Tell us about yourself. We'll send a code to your email to confirm it's really you.</p>
      <div id="fields"></div>
      <label class="consent" data-field="consent">
        <input type="checkbox" id="consent">
        <span>I agree that PBAT DOOR TO DOOR may store these details and contact me about volunteer activities. I can ask for my details to be updated or removed at any time.</span>
      </label>
      <div class="msg err" id="form-err"></div>
      <button class="btn block" id="submit" type="submit" style="margin-top:20px"><span class="spinner"></span><span>Continue</span></button>
      <p class="switch">Already a member? <a href="/login">Log in</a></p>
    </form>

    <!-- Step 2: code -->
    <form class="card narrow step" id="s-code" novalidate>
      <h1>Confirm your email</h1>
      <p class="sub">We sent a 6-digit code to <strong id="sent-to"></strong>. It expires in 10 minutes.</p>
      <div class="otp" id="otp" role="group" aria-label="Confirmation code"></div>
      <button class="btn block" id="verify" type="submit" style="margin-top:16px"><span class="spinner"></span><span>Create my account</span></button>
      <div class="msg err" id="code-err"></div>
      <div class="msg dev" id="dev-note"></div>
      <div class="row">
        <button type="button" class="linkish" id="back">← Edit my details</button>
        <button type="button" class="linkish" id="resend" disabled>Resend code</button>
      </div>
    </form>
  </div>
</main>

<script type="module">
  import { $, api, setLoading, message, devCodeNote, showStep, createOtp, cooldown,
           renderProfileFields, readProfileFields, checkProfile, showFieldErrors } from '/app.js';

  let email = '';
  const fields = $('#fields');

  const me = await api('/api/me');
  if (me.ok) location.replace('/account');

  const { data: opts } = await api('/api/options');
  renderProfileFields(fields, opts);
  showStep('s-form');
  $('#f-full_name').focus();

  // Step 1
  $('#s-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    message($('#form-err'), '');
    const p = readProfileFields(fields);
    const errors = checkProfile(p);
    if (!showFieldErrors(fields, errors)) return message($('#form-err'), 'Please fix the highlighted fields.');
    if (!$('#consent').checked) return message($('#form-err'), 'Please tick the box to agree before continuing.');

    const btn = $('#submit'); setLoading(btn, true);
    const { ok, data } = await api('/api/auth/signup', { ...p, consent: true });
    setLoading(btn, false);

    if (!ok) {
      if (data.fields) showFieldErrors(fields, data.fields);
      if (data.code === 'exists') {
        const span = document.createElement('span');
        span.innerHTML = 'This email already has an account. <a href="/login">Log in instead</a>.';
        return message($('#form-err'), span);
      }
      if (data.retryAfter) { email = p.email.trim().toLowerCase(); goToCode(data.retryAfter); return message($('#code-err'), data.error); }
      return message($('#form-err'), data.error || 'Something went wrong.');
    }
    email = p.email.trim().toLowerCase();
    devCodeNote($('#dev-note'), data.devCode);
    goToCode(data.cooldown);
  });

  function goToCode(wait) {
    $('#sent-to').textContent = email;
    message($('#code-err'), '');
    showStep('s-code');
    otp.clear();
    cooldown($('#resend'), wait || 60);
  }

  // Step 2
  const otp = createOtp($('#otp'), () => $('#s-code').requestSubmit());
  $('#s-code').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = otp.value();
    if (code.length !== 6) return message($('#code-err'), 'Enter all 6 digits.');
    const btn = $('#verify'); if (btn.disabled) return;
    setLoading(btn, true);
    const { ok, data } = await api('/api/auth/verify-code', { email, code });
    setLoading(btn, false);
    if (!ok) {
      otp.shake(); otp.clear();
      message($('#code-err'), data.error || 'Something went wrong.');
      if (data.expired) { clearInterval($('#resend')._timer); $('#resend').disabled = false; $('#resend').textContent = 'Send a new code'; }
      return;
    }
    location.href = '/account?welcome=1';
  });

  $('#resend').addEventListener('click', async () => {
    $('#resend').disabled = true; message($('#code-err'), '');
    const { ok, data } = await api('/api/auth/request-code', { email });
    if (!ok) { if (data.retryAfter) cooldown($('#resend'), data.retryAfter); else $('#resend').disabled = false; return message($('#code-err'), data.error); }
    devCodeNote($('#dev-note'), data.devCode);
    message($('#code-err'), 'A new code is on its way.', 'ok');
    cooldown($('#resend'), data.cooldown); otp.clear();
  });

  $('#back').addEventListener('click', () => showStep('s-form'));
</script>
</body>
</html>
