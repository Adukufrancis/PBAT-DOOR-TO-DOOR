<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · PBAT DOOR TO DOOR</title>
<meta name="theme-color" content="#06492a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6b3d'/%3E%3Cpath d='M10 26V7h12v19' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%23e2a72e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 21V3h12v18M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14.5" cy="12.5" r="1.3" fill="#e2a72e"/></svg></span>
      <span>PBAT DOOR TO DOOR<small>Volunteer network</small></span>
    </a>
    <div class="nav-links">
      <button class="btn small ghost" id="logout" type="button">Log out</button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <div class="boot" id="boot">Loading…</div>

    <form class="card wide" id="form" hidden novalidate>
      <div class="steps" aria-hidden="true"><span class="on"></span><span class="on"></span></div>
      <div class="via" id="via"></div>
      <h1>Welcome! Tell us about yourself</h1>
      <p class="sub">One last step. This helps us connect you with volunteers in your state, LGA and ward.</p>
      <div id="fields"></div>
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>I agree that PBAT DOOR TO DOOR may store these details and contact me about volunteer activities. I can ask for my details to be updated or removed at any time.</span>
      </label>
      <div class="msg err" id="form-err"></div>
      <button class="btn block" id="save" type="submit" style="margin-top:20px"><span class="spinner"></span><span>Finish and go to my account</span></button>
    </form>
  </div>
</main>

<script type="module">
  import { $, api, setLoading, message, renderProfileFields, readProfileFields, checkProfile, showFieldErrors, prettyPhone } from '/app.js';

  const me = await api('/api/me');
  if (!me.ok) { location.replace('/login'); await new Promise(() => {}); }
  const member = me.data.member;
  if (member.profileComplete) { location.replace('/account'); await new Promise(() => {}); }

  const { data: opts } = await api('/api/options');
  $('#via').textContent = `✓ Signed in with ${member.emailVerified ? member.email : prettyPhone(member.phone)}`;
  const fields = $('#fields');
  renderProfileFields(fields, opts, member);
  $('#boot').hidden = true; $('#form').hidden = false;
  $('#f-full_name').focus();

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    message($('#form-err'), '');
    const p = readProfileFields(fields);
    if (!showFieldErrors(fields, checkProfile(p, member))) return message($('#form-err'), 'Please fix the highlighted fields.');
    if (!$('#consent').checked) return message($('#form-err'), 'Please tick the box to agree before continuing.');
    const btn = $('#save'); setLoading(btn, true);
    const { ok, data } = await api('/api/me', { ...p, consent: true });
    setLoading(btn, false);
    if (!ok) {
      if (data.fields) showFieldErrors(fields, data.fields);
      return message($('#form-err'), data.error || 'Something went wrong.');
    }
    location.href = '/account?welcome=1';
  });

  $('#logout').addEventListener('click', async () => { await api('/api/auth/logout', {}); location.href = '/login'; });
</script>
</body>
</html>
